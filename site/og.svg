<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1009"/>
      <stop offset="1" stop-color="#070904"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7f27a"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#242b1b" stroke-width="2"/>

  <!-- brand mark -->
  <g transform="translate(90,86)">
    <rect width="64" height="64" rx="16" fill="#12170d" stroke="#2b3420" stroke-width="2"/>
    <text x="32" y="47" font-family="monospace" font-size="42" font-weight="800" fill="#a3e635" text-anchor="middle">L</text>
    <text x="84" y="46" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="38" font-weight="800" fill="#e8ede1">limer.sh</text>
  </g>

  <!-- headline -->
  <g transform="translate(90,250)" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-weight="800">
    <text x="0" y="0" font-size="76" fill="#e8ede1" letter-spacing="-2">The reverse proxy that</text>
    <text x="0" y="92" font-size="76" fill="#e8ede1" letter-spacing="-2">routes on <tspan fill="url(#lime)">what&#8217;s inside</tspan></text>
    <text x="0" y="184" font-size="76" fill="#e8ede1" letter-spacing="-2">the request.</text>
  </g>

  <!-- subline -->
  <text x="90" y="540" font-family="monospace" font-size="27" fill="#9aa58c">Ultra-fast, payload-aware HTTP server &amp; load balancer &#183; C</text>

</svg>
