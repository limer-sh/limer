name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: build, unit, fuzz, integration, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev libzstd-dev libbrotli-dev libnghttp2-dev pkg-config python3 curl valgrind
      - name: Install gRPC test client (python)
        run: python3 -m pip install --user grpcio grpcio-tools || pip3 install --user grpcio grpcio-tools
      - name: Build
        run: make
      - name: Unit tests
        run: make unit
      - name: Parser fuzzing
        run: make fuzz FUZZ_ITERS=200000
      - name: Integration tests
        run: make integration
      - name: Feature tests
        run: make features
      - name: Install Pebble (ACME test server)
        run: |
          curl -sSL -o /tmp/pebble.tar.gz https://github.com/letsencrypt/pebble/releases/latest/download/pebble-linux-amd64.tar.gz
          tar xzf /tmp/pebble.tar.gz -C /tmp
          sudo install -m 0755 "$(find /tmp/pebble-linux-amd64 -type f -name pebble)" /usr/local/bin/pebble
          curl -sSL -o /tmp/challtestsrv.tar.gz https://github.com/letsencrypt/pebble/releases/latest/download/pebble-challtestsrv-linux-amd64.tar.gz
          tar xzf /tmp/challtestsrv.tar.gz -C /tmp
          sudo install -m 0755 "$(find /tmp/pebble-challtestsrv-linux-amd64 -type f -name pebble-challtestsrv)" /usr/local/bin/pebble-challtestsrv
          echo "127.0.0.1 limer.test www.limer.test alpn.limer.test dns.limer.test" | sudo tee -a /etc/hosts
      - name: Automatic HTTPS (ACME) tests
        run: make acme
      - name: Security tests
        run: make security
      - name: Build without TLS
        run: make clean && make TLS=0 && ./limer version

  sanitizers:
    name: suites under ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev libzstd-dev libbrotli-dev libnghttp2-dev pkg-config python3 curl
      - name: Sanitized build and suites
        run: make check-asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  macos:
    name: macOS (kqueue) build and suites
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install pkgconf openssl@3 nghttp2 zstd brotli libxcrypt coreutils gnu-sed
      - name: Loopback aliases for the per-caller tests
        run: for i in 2 3 5; do sudo ifconfig lo0 alias 127.0.0.$i up; done
      - name: Build
        run: make && ./limer version
      - name: Unit tests
        run: make unit
      - name: Parser fuzzing
        run: make fuzz FUZZ_ITERS=200000
      - name: Integration tests
        run: make integration
      - name: Feature tests
        run: make features
      - name: Security, DoS guard, rollback and admin tests
        run: make security ddos scale drain rollback binrollback status admin
